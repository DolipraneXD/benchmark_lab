# BenchLab model registry. Edit freely; `benchlab models` validates it.
#
# Field reference (per model):
#   reference          true -> published scores only (no key, never called, never run)
#   id                 short id, used in run folders, results.csv and tracker keys (<id>__<bench>)
#   name               display name
#   provider           openai_compatible | anthropic | bedrock
#   base_url           required for openai_compatible (…/v1); optional override for anthropic
#   model              model name sent to the API (for bedrock: the model id / inference profile)
#   api_key_env        env var holding the key (read from .env). Never put keys here.
#   kind               chat (default) | embedding | reranker
#   self_hosted        true -> serving benchmark applies, and the self-hosted hints are shown
#   price_in_per_mtok  USD per 1M input tokens  (0 = unknown -> cost reported as n/a)
#   price_out_per_mtok USD per 1M output tokens
#   max_concurrency    parallel requests the harnesses may use against this model
#   extra_params       request params for this model. `temperature: null` REMOVES the
#                      global default (recorded as a per-model exception in config.json).
#   region             bedrock only (falls back to AWS_REGION_NAME)
#   extras             extra benchmark keys that apply to this model (beyond its suites)
#   suites             which suites this model runs: core (default for chat), coder, retrieval
#   published          published scores {bench_key: percent} used for the "suspicious results" list
#   knowledge_cutoff   YYYY-MM-DD; LiveCodeBench only uses problems released after it
#   notes              free text, copied into every run's config.json

settings:
  profile: lite                 # lite = same benches, ~1/5 of the cost (smaller fixed subsets; see README "Cheap mode")
  baseline_model: ml4               # every delta in the report is vs this id
  litellm_proxy_port: 4000
  default_temperature: 0.0
  default_max_tokens: 4096
  request_timeout_s: 300
  tau2_user_model: ml4              # FIXED user simulator for τ²-bench, identical for every run
  tau2_user_model_params: {}
models:
  # ---- reference only (never called, never benchmarked) ---------------------

  - id: ml4
    name: Mistral Large 4
    provider: openai_compatible
    base_url: https://api.mistral.ai/v1
    model: mistral-large-latest                     # TODO pin exact version
    api_key_env: MISTRAL_API_KEY
    price_in_per_mtok: 0.0
    price_out_per_mtok: 0.0
    max_concurrency: 8
    extra_params: {}
    extras: [ml4_aider]
    suites: [core, coder]                           # baseline also runs the coder suite (reference for qcoder)




