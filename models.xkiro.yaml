# Trial registry: every chat model through xkiro.com (one OpenAI-compatible endpoint,
# free tier ~1M tokens/day). Use it to try the pipeline end to end, NOT for the final
# numbers: a reseller can't prove it serves the exact official weights/quantization,
# and quota errors mid-run show up as API errors.
#
#   export XKIRO_API_KEY=...            # or put it in .env; never in this file
#   curl -s https://api.xkiro.com/v1/models -H "Authorization: Bearer $XKIRO_API_KEY"
#                                       # -> copy the exact ids into `model:` below
#   uv run benchlab check -c models.xkiro.yaml -m all
#   uv run benchlab run -c models.xkiro.yaml -m ml4 --stage 1 --smoke
#
# Token accounting: prices are set to 1.0/1.0, so "USD" in this file means
# "millions of tokens". `--budget-usd 0.9` stops a run at ~0.9M tokens (under the
# daily quota), and the report's cost column reads as Mtokens. Results go to
# runs_xkiro/ and results_xkiro/ so they never mix with real runs.

settings:
  profile: lite
  baseline_model: ml4
  tau2_user_model: ml4
  tau2_user_model_params: {}
  grader_model: dsflash
  runs_dir: runs_xkiro
  results_dir: results_xkiro
  default_temperature: 0.0
  default_max_tokens: 4096
  request_timeout_s: 300

models:
  # ---- reference only (never called, never benchmarked) ---------------------
  - id: claude
    name: Claude Sonnet 5.5
    reference: true                                 # published scores only; shown as an italic row in the report
    provider: anthropic
    model: claude-sonnet-5-5
    # Copy from Anthropic's model card / system card. Keys are bench ids
    # (gpqa, bfcl, t2air, t2ret, t2tel, tb, swe, gaia, lcb, aider). Published
    # numbers use their own harness settings, so they are context, not a delta.
    published: {}   # e.g. {gpqa: 0.0, swe: 0.0}

  - id: ml4
    name: Mistral Large 4 (xkiro)
    provider: openai_compatible
    base_url: https://api.xkiro.com/v1              # confirmed (mistral_xkiro in models.yaml)
    model: mistralai/mistral-large-4-0
    api_key_env: XKIRO_API_KEY
    price_in_per_mtok: 1.0
    price_out_per_mtok: 1.0
    max_concurrency: 4
    suites: [core, coder]
    notes: via xkiro.com reseller, trial only

