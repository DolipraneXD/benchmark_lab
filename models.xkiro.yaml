# Trial registry: every chat model through xkiro.com (one OpenAI-compatible endpoint,
# free tier ~1M tokens/day). Use it to try the pipeline end to end, NOT for the final
# numbers: a reseller can't prove it serves the exact official weights/quantization,
# and quota errors mid-run show up as API errors.
#
# Add models from the control panel (`benchlab ui`, config switcher -> models.xkiro.yaml,
# Models -> Add a model). Then:
#   benchlab check -c models.xkiro.yaml -m all
#   benchlab run -c models.xkiro.yaml -m minimax --stage 1 --smoke
#
# Token accounting: prices of 1.0/1.0 mean "USD" = "millions of tokens" for that
# model (free-tier quota). Models xkiro bills (paid plan / top-up) carry their real
# prices instead, e.g. minimax below. `--budget-usd 0.9` stops a run at ~0.9M tokens (under the
# daily quota), and the report's cost column reads as Mtokens. Results go to
# workspace/runs_xkiro/ and workspace/results_xkiro/ so they never mix with real runs.

settings:
  profile: lite
  baseline_model: minimax
  tau2_user_model: minimax
  tau2_user_model_params: {}
  runs_dir: workspace/runs_xkiro
  results_dir: workspace/results_xkiro
  default_temperature: 0.0
  default_max_tokens: 4096
  request_timeout_s: 300

models:
  - id: minimax
    name: MiniMax M3.1 Flash (xkiro)
    provider: openai_compatible
    base_url: https://api.xkiro.com/v1
    model: minimax/minimax-m3.1-flash
    api_key_env: BENCHLAB_KEY_MINIMAX               # same xkiro account as minimax in models.yaml
    price_in_per_mtok: 0.15                         # xkiro price page; paid plan or top-up required
    price_out_per_mtok: 0.60
    max_concurrency: 4
    # Reasoning effort defaults to max (expect many output tokens). To pin it, add
    # e.g. {reasoning_effort: high}; it is recorded as a per-model exception.
    extra_params: {}
    notes: via xkiro.com reseller, trial only
